name: CI

on:
  # Executa a mesma esteira em pushes e pull requests.
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # O intervalo de commits precisa do histórico completo, inclusive da base da PR.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      # O pre-commit não faz parte das dependências instaladas pelo uv sync.
      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Install deps
        run: uv sync --locked

      # Verifica todos os arquivos; o estágio commit-msg roda na etapa seguinte.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Validar mensagens de commit
        # Tags e exclusões de branches não têm o intervalo usado nesta validação.
        if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && !github.event.deleted)
        shell: bash
        env:
          # PR: base/head da proposta. Push: estado anterior/posterior da branch.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          range="$BASE_SHA..$HEAD_SHA"

          # Uma branch nova recebe um SHA anterior composto apenas por zeros.
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"

            # Compara com a branch padrão quando ela existe e é outra branch.
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] &&
               git show-ref --verify --quiet "$default_ref"; then
              range="$default_ref..$HEAD_SHA"
            else
              # Sem uma base adequada, valida todo o histórico alcançável pelo head.
              range="$HEAD_SHA"
            fi
          fi

          commits=$(git rev-list --reverse "$range")
          # O hook exige um arquivo com a mensagem; remove-o mesmo em caso de falha.
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT

          for sha in $commits; do
            echo "Validando mensagem de $sha"
            git show -s --format=%B "$sha" > "$message_file"
            # --all-files não cobre commit-msg; cada mensagem precisa desta chamada.
            uv run pre-commit run \
              --hook-stage commit-msg \
              --commit-msg-filename "$message_file"
          done

      - name: Publicar cobertura
        run: |
          {
            echo '## Cobertura de testes'
            echo '```text'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
