default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        args: ["."]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0 # use: pre-commit autoupdate
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: django-check
        name: django check
        entry: uv run manage.py check
        language: system
        pass_filenames: false
      - id: django-migrations
        name: pending migrations
        entry: uv run manage.py makemigrations --check
        language: system
        pass_filenames: false
      - id: coverage
        name: test coverage
        entry: bash -c "uv run coverage run manage.py test && uv run coverage report"
        language: system
        pass_filenames: false
